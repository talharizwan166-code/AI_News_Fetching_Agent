[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcheck"
version = "0.2.0"
description = "Local chatbot checks, rubric judging, blinded review and client reports"
readme = "docs/chatcheck-package.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27,<1",
    "jsonpath-ng>=1.6,<2",
    "playwright>=1.45,<2",
    "Jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
pdf = ["WeasyPrint>=68,<71", "pypdf>=5,<7"]
dev = ["pytest>=8", "build>=1.2", "setuptools>=77", "wheel>=0.45", "pypdf>=5,<7"]

[project.scripts]
chatcheck = "chatcheck.cli:main"

[tool.setuptools]
packages = ["chatcheck", "chatcheck.suites"]
package-dir = {"chatcheck.suites" = "suites"}
include-package-data = false

[tool.setuptools.package-data]
chatcheck = ["report_templates/*.html", "report_templates/*.css", "report_templates/*.json", "workspace_templates/*", "workspace_templates/.env.example"]
"chatcheck.suites" = ["*.json", "README.md"]
