name: AI News Agent

on:
  schedule:
    - cron: "0 5 * * *"   # Primary: 10:00 AM PKT (5:00 AM UTC)
    - cron: "30 5 * * *"  # Backup: 10:30 AM PKT in case first run is skipped
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: news-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: "0"
      GIT_EDITOR: "true"
      GIT_SEQUENCE_EDITOR: "true"
      GCM_INTERACTIVE: "Never"

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          missing=0
          for name in GEMINI_API_KEY EMAIL_SENDER EMAIL_PASSWORD EMAIL_RECIPIENT; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check data branch
        id: data_branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/data; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # Exit code 2 means the branch is missing; other errors must surface.
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout data branch
        if: steps.data_branch.outputs.exists == 'true'
        uses: actions/checkout@v4.2.2
        with:
          ref: data
          path: data-branch
          persist-credentials: true
          token: ${{ github.token }}

      - name: Prepare database (inside workspace)
        env:
          DATA_BRANCH_EXISTS: ${{ steps.data_branch.outputs.exists }}
        run: |
          if [ "$DATA_BRANCH_EXISTS" != "true" ]; then
            # The new worktree shares main checkout's persisted HTTPS credentials.
            git worktree add --orphan -b data data-branch
            git -C data-branch config user.name "github-actions[bot]"
            git -C data-branch config user.email "github-actions[bot]@users.noreply.github.com"
            git -C data-branch commit --allow-empty -m "Update news_agent.db [skip ci]"
          fi

          python - <<'PY'
          from src.database import get_connection, init_db, seed_from_json

          db_path = "data-branch/news_agent.db"
          init_db(db_path)
          with get_connection(db_path) as conn:
              count = conn.execute("SELECT COUNT(*) FROM published_articles").fetchone()[0]
          if count == 0:
              added = seed_from_json(db_path, "data/seed_published.json")
              print(f"Seeded {added} published articles into the empty database.")
          else:
              print(f"Database already has {count} published articles; skipping seed.")
          PY

      - name: Check if already ran today (skip backup if primary succeeded)
        id: check
        uses: actions/github-script@v7.0.1
        with:
          script: |
            try {
              if (context.eventName === 'workflow_dispatch') {
                console.log('Manual run requested. Bypassing the already-ran-today guard.');
                core.setOutput('skip', 'false');
                return;
              }
              const today = new Date().toISOString().split('T')[0];
              // Use workflow filename, not display name
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'news_agent.yml',
                per_page: 20,
                status: 'success',
                created: `>=${today}T00:00:00Z`
              });
              // Exclude current run
              const currentRunId = context.runId;
              const hasRunToday = runs.data.workflow_runs.some(r =>
                r.id !== currentRunId &&
                r.conclusion === 'success' &&
                r.created_at.startsWith(today)
              );
              if (hasRunToday) {
                console.log('Workflow already ran successfully today. Skipping.');
                core.setOutput('skip', 'true');
              } else {
                console.log('No successful run today. Proceeding.');
                core.setOutput('skip', 'false');
              }
            } catch (error) {
              core.warning(`Could not check previous runs: ${String(error)}`);
              console.log('Proceeding with agent run to be safe.');
              core.setOutput('skip', 'false');
            }

      - name: Run AI News Agent
        id: agent
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DB_PATH: data-branch/news_agent.db
        run: python main.py

      - name: Commit and push DB to data branch
        if: always() && steps.check.outputs.skip != 'true'
        timeout-minutes: 5
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          if [ "$AGENT_OUTCOME" != "success" ]; then
            echo "Agent did not succeed; skipping database commit and push."
            exit 0
          fi
          if [ ! -f data-branch/news_agent.db ]; then
            echo "No database file to commit; skipping database commit and push."
            exit 0
          fi
          cd data-branch
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f news_agent.db
          if git diff --cached --quiet -- news_agent.db; then
            echo "Database has no changes; skipping database commit and push."
            exit 0
          fi
          git commit --amend --no-edit
          git push --force origin HEAD:refs/heads/data

      - name: Skip notice
        if: steps.check.outputs.skip == 'true'
        run: echo "Workflow already ran successfully today. Backup run skipped."
