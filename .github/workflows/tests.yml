name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'              # Ignore markdown changes
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install browser for chatbot widget tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          CHATCHECK_TEST_WIDGET: "1"
        run: python -m pytest tests/ -v

      - name: Check all Python syntax
        run: |
          python -c "
          import ast
          from pathlib import Path
          files = [*Path('.').glob('*.py'), *Path('src').rglob('*.py'), *Path('chatcheck').rglob('*.py'), *Path('tests').rglob('*.py')]
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('All Python files have valid syntax')
          "
